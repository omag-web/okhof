name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Commits made by the photo workflow don't trigger "push", so redeploy when it finishes.
  workflow_run:
    workflows: ["Download photos from Squarespace"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        # With a custom domain (CNAME file) the site lives at the root; otherwise at /<repo-name>.
        run: |
          if [ -f CNAME ]; then export BASE_PATH=""; else export BASE_PATH="${{ steps.pages.outputs.base_path }}"; fi
          node src/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
