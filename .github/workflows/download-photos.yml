name: Download photos from Squarespace

# Run this once (Actions tab → "Download photos from Squarespace" → Run workflow) to copy every
# inductee portrait and archive photo out of Squarespace and into the repo's media/ folder.
# Re-running is safe; files already in the repo are skipped.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download photos
        run: node scripts/fetch-photos.mjs
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media data
          if git diff --cached --quiet; then
            echo "No new photos."
          else
            git commit -m "Copy inductee and archive photos from Squarespace"
            git push
          fi
